<title>AI &rarr; Agentic AI Master Academy — Version 2</title>


<style>

 :root {
  color-scheme: light;
  --bg:#f6f7fb; --bg-elev:#ffffff; --text:#202a40; --text-dim:#536079;
  --border:#d6ddea; --accent:#5146b8; --accent-2:#413594; --accent-soft:#eeebfa;
  --success:#166b55; --warn:#92501f; --danger:#ae303b; --info:#245f99;
  --code-bg:#edf0f7; --code-text:#28344e; --shadow:none; --radius:14px;
}
[data-theme="dark"] {
  color-scheme:dark;
  --bg:#253046; --bg-elev:#303d55; --text:#f4f6fc; --text-dim:#cbd3e3;
  --border:#64718a; --accent:#bdb2fa; --accent-2:#d1c8ff; --accent-soft:#40456c;
  --success:#9ae3cd; --warn:#ffcd9c; --danger:#ffb5bd; --info:#b7d9ff;
  --code-bg:#263348; --code-text:#e7ecf8; --shadow:none;
}
* { box-sizing: border-box; }
html,body { margin:0; padding:0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); transition: background .2s, color .2s;
}
#app { display:flex; min-height:100vh; }
.sidebar {
  width: 264px; flex-shrink:0; background: var(--bg-elev); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:20;
}
.brand { padding: 22px 20px 14px; border-bottom:1px solid var(--border); }
.brand-kicker { font-size:9.5px; letter-spacing:2px; color: var(--accent); font-weight:700; margin-bottom:6px;}
.brand-title { font-size:17px; font-weight:800; line-height:1.3; }
.navlist { list-style:none; margin:0; padding: 10px 10px; flex:1; }
.navlist li { margin: 2px 0; }
.navlist a {
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; color: var(--text-dim);
  text-decoration:none; font-size:13.5px; font-weight:600; cursor:pointer;
}
.navlist a:hover { background: var(--accent-soft); color: var(--accent-2); }
.navlist a.active { background: var(--accent); color:#fff; }
.navlist .navicon { font-size:15px; width:18px; text-align:center; }
.sidebar-footer { padding:14px 18px 20px; border-top:1px solid var(--border); }
.theme-select { font-size:13px; font-weight:600; padding:9px 34px 9px 12px; min-height:38px; background-size:18px; background-position: right 10px center; }
.version { font-size:12px; color: var(--text-dim); margin-top:10px; text-align:center;}
#main { flex:1; min-width:0; }
#content { max-width: 1080px; margin: 0 auto; padding: 34px 34px 80px; }
.mobile-nav-toggle { display:none; }

h1,h2,h3,h4 { font-weight:800; line-height:1.25; margin: 0 0 10px; }
h1 { font-size:26px; } h2 { font-size:19px; margin-top:6px;} h3{font-size:15px;} h4{font-size:13px;}
p { line-height:1.6; color: var(--text-dim); }
a { color: var(--accent-2); }
.pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent-2); }
.card { background: var(--bg-elev); border:1px solid var(--border); border-radius: var(--radius); padding:20px 22px; margin-bottom:18px; box-shadow: var(--shadow); }
.grid { display:grid; gap:16px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 900px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }
.stat { text-align:center; }
.stat .num { font-size: 30px; font-weight:800; color: var(--accent-2); }
.stat .label { font-size:11.5px; color: var(--text-dim); text-transform:uppercase; letter-spacing:.5px;}
.progressbar { height:10px; border-radius:6px; background: var(--accent-soft); overflow:hidden; margin:8px 0; }
.progressbar-fill { height:100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:6px; transition: width .3s; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:9px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text); font-size:12.5px; font-weight:700; cursor:pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent-2); }
.btn.primary { background: var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover { background: var(--accent-2); color:#fff; }
.btn.small { padding:5px 10px; font-size:11px; }
select, input[type=text], textarea {
  background: var(--bg); color: var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; font-family: inherit;
}
textarea { width:100%; resize:vertical; }
table { width:100%; border-collapse:collapse; font-size:12.8px; }
th, td { border-bottom:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top;}
th { color: var(--text-dim); text-transform:uppercase; font-size:10.5px; letter-spacing:.4px; }
tr:hover td { background: var(--accent-soft); }
.tag { display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:700; background:var(--accent-soft); color:var(--accent-2); margin-right:4px;}
.week-list { display:flex; flex-direction:column; gap:8px; }
.week-row { display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:10px; border:1px solid var(--border); cursor:pointer; background: var(--bg-elev); }
.week-row:hover { border-color: var(--accent); }
.week-row .wk-num { width:34px; height:34px; border-radius:50%; background: var(--accent-soft); color: var(--accent-2); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;}
.week-row .wk-info { flex:1; }
.week-row .wk-title { font-weight:700; font-size:13.5px; }
.week-row .wk-theme { font-size:11.5px; color: var(--text-dim); margin-top:2px;}
.phase-header { font-size:11px; text-transform:uppercase; letter-spacing:1px; color: var(--accent); font-weight:800; margin: 22px 0 8px; }
.checklist-item { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.checklist-item:last-child { border-bottom:none; }
.checklist-item input[type=checkbox] { width:18px; height:18px; accent-color: var(--accent); cursor:pointer; }
.qa-card .hint { display:block; font-size:11px; color: var(--text-dim); margin-top:14px; font-weight:400;}
.deck-select-label { display:block; font-size:11.5px; font-weight:700; color: var(--text-dim); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; }
select:not(.status-select) {
  appearance:none; -webkit-appearance:none; -moz-appearance:none;
  font-size:15px; font-weight:600; padding:12px 40px 12px 14px; min-height:46px;
  width:100%; color: var(--text); background-color: var(--bg-elev);
  border:2px solid var(--border); border-radius:10px; cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='%235146b8'/><path d='M7.5 10l4.5 4.5 4.5-4.5' fill='none' stroke='%23ffffff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat; background-position: right 12px center; background-size:22px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition: border-color .15s ease;
}
select:not(.status-select):hover { border-color: var(--accent); }
select:not(.status-select):focus { outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.qa-card { background:var(--bg-elev); border:1px solid var(--border); border-radius: var(--radius); padding:36px 26px; min-height:160px; text-align:center; box-shadow: var(--shadow); }
.qa-kicker { display:block; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color: var(--text-dim); margin-bottom:10px; }
.qa-question { font-size:17px; font-weight:700; }
.qa-divider { border:none; border-top:1px dashed var(--border); margin:22px auto; width:70%; }
.qa-answer-label { display:block; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color: var(--accent); margin-bottom:8px; }
.qa-answer { font-size:16px; font-weight:600; color: var(--accent-2); }
.mermaid-controls { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.mermaid-viewport { overflow:hidden; height:480px; position:relative; }
.mermaid-viewport svg { transform-origin:0 0; }
.quiz-q { margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--border); }
.quiz-opt { display:block; padding:9px 12px; border:1px solid var(--border); border-radius:9px; margin:6px 0; cursor:pointer; font-size:13px; }
.quiz-opt:hover { border-color: var(--accent); }
.quiz-opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.quiz-opt.correct { border-color: var(--success); background: rgba(0,184,148,.12); }
.quiz-opt.incorrect { border-color: var(--danger); background: rgba(214,48,49,.12); }
.searchbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.searchbar input, .searchbar select { flex:1; min-width:140px; }
.mermaid-box { background: var(--bg-elev); border:1px solid var(--border); border-radius: var(--radius); padding:18px; overflow-x:auto; text-align:center; }
.resource-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
.resource-card { background: var(--bg-elev); border:1px solid var(--border); border-radius: var(--radius); padding:18px 20px; box-shadow: var(--shadow); display:flex; flex-direction:column; gap:8px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.resource-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(20,20,43,0.18); border-color: var(--accent); }
.resource-card .res-name { font-size:14.5px; font-weight:700; text-decoration:underline; text-underline-offset:2px; color: var(--accent-2); }
.resource-card .res-name:hover { color: var(--accent); }
.resource-card .res-provider { font-size:11.5px; color: var(--text-dim); }
.resource-card .res-why { font-size:12.5px; color: var(--text-dim); line-height:1.5; flex:1; margin:0; }
.resource-card .res-badges { display:flex; flex-wrap:wrap; gap:6px; }
.resource-card .res-footer { display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color: var(--text-dim); margin-top:2px; padding-top:8px; border-top:1px solid var(--border); }
.badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700; line-height:1.4; }
.badge-type { background: var(--accent-soft); color: var(--accent-2); }
.badge-free { background: rgba(0,184,148,.15); color: var(--success); }
.badge-paid { background: rgba(225,112,85,.15); color: var(--warn); }
.badge-mixed { background: rgba(9,132,227,.15); color: var(--info); }
.badge-beginner { background: rgba(0,184,148,.15); color: var(--success); }
.badge-intermediate { background: rgba(9,132,227,.15); color: var(--info); }
.badge-advanced { background: rgba(225,112,85,.15); color: var(--warn); }
.badge-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
.radar-ring { margin-bottom:16px; }
.radar-ring h4 { margin-bottom:8px; }
.radar-items { display:flex; flex-wrap:wrap; gap:8px; }
.radar-item { background: var(--accent-soft); color: var(--accent-2); padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600; }
.status-select { font-size:11.5px; padding:4px 8px; }
.two-col { display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
.subnav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.subnav button { padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text-dim); font-size:12.5px; font-weight:700; cursor:pointer; }
.subnav button.active { background: var(--accent); color:#fff; border-color:var(--accent); }
blockquote { border-left:4px solid var(--accent); margin:14px 0; padding:6px 16px; background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--text); }
hr.sep { border:none; border-top:1px solid var(--border); margin:22px 0; }
.mini-note { font-size:11.5px; color: var(--text-dim); }
.lesson-acc { border:1px solid var(--border); border-radius:10px; margin:10px 0; overflow:hidden; background: var(--bg); }
.lesson-acc summary { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; font-size:13.5px; list-style:none; }
.lesson-acc summary::-webkit-details-marker { display:none; }
.lesson-acc summary::before { content:'\25B8'; color: var(--accent); font-size:12px; transition: transform .15s; margin-right:2px; }
.lesson-acc[open] summary::before { transform: rotate(90deg); }
.lesson-acc summary:hover { background: var(--accent-soft); }
.lesson-check { flex-shrink:0; font-size:16px; cursor:pointer; line-height:1; }
.lesson-check.is-read { filter: none; }
.lesson-summary-text { flex:1; color: var(--text); }
.lesson-body { padding: 4px 18px 20px 40px; font-size:13.5px; line-height:1.7; color: var(--text-dim); }
.lesson-body p { margin: 0 0 14px; color: var(--text-dim); }
.lesson-body strong { color: var(--text); }
.lesson-body code { background: var(--code-bg); color: var(--code-text); padding:1px 5px; border-radius:4px; font-size:12px; }
.lesson-body pre { background: var(--code-bg); color: var(--code-text); padding:12px 14px; border-radius:8px; overflow-x:auto; font-size:12px; }
.lesson-body pre code { background:none; padding:0; }
.lesson-body ul, .lesson-body ol { padding-left:20px; margin: 0 0 14px; }
.lesson-body blockquote { margin: 10px 0; }
@media (max-width: 780px) {
  .sidebar { position:fixed; left:-280px; top:0; height:100vh; transition:left .2s; box-shadow: 0 0 30px rgba(0,0,0,.3); }
  .sidebar.open { left:0; }
  .mobile-nav-toggle { display:block; position:fixed; top:14px; left:14px; z-index:30; background:var(--accent); color:#fff; border:none; width:40px; height:40px; border-radius:10px; font-size:18px; cursor:pointer;}
  #content { padding: 70px 18px 60px; }
}

:focus-visible {outline:3px solid var(--accent);outline-offset:3px;}

.project-tools {display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0;}
.project-tools input[type=search] {flex:1;min-width:200px;background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;padding:12px;color:var(--text);font:inherit;}

.project-number {font-variant-numeric:tabular-nums;font-size:16px;color:var(--text-dim);width:28px;flex-shrink:0;}

.project-body ol,.project-body ul {padding-left:22px;max-width:74ch;}
.project-body li {margin:8px 0;}

input[type=checkbox] {width:18px;height:18px;accent-color:var(--accent);}
.evidence-fields {display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.evidence-fields label {display:block;font-size:13px;font-weight:600;}
.evidence-fields input {display:block;width:100%;margin-top:7px;min-height:44px;font:inherit;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--bg-elev);color:var(--text);}

.evidence-fields textarea {margin-top:7px;}
.study-note {padding:16px 0;max-width:74ch;}
.backup-tools {padding:22px 0;border-block:1px solid var(--border);margin:28px 0;}
.backup-tools p {font-size:13px;margin:8px 0;}
#saveNotice {padding:10px 20px;background:var(--accent-soft);color:var(--text);font-size:13px;}
.skip-link {position:absolute;left:20px;top:-70px;z-index:100;background:var(--bg-elev);padding:12px;}
.skip-link:focus {top:8px;}
.canonical-links {display:flex;gap:18px;flex-wrap:wrap;margin:14px 0;}
